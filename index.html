    <title>Timbang</title>
    <script>
      // Apply the saved theme before the first paint, so nobody sees a flash of the wrong one. Dark is the default.
      (function () {
        var theme = 'dark';
        try {
          var saved = JSON.parse(localStorage.getItem('timbang.theme.v2') || 'null');
          if (saved && saved.state && saved.state.theme === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#e4e8f0' : '#0a0f24');
      })();
    </script>
    <style>
      /* Launch screen. Shown from the first paint until the app is ready, then faded out by main.tsx. */
      html, body { margin: 0; background: #0a0f24; }
      html[data-theme='light'], html[data-theme='light'] body { background: #e4e8f0; }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #0a0f24; color: #eef0fa; transition: opacity 360ms ease, visibility 360ms;
      }
      html[data-theme='light'] #splash { background: #e4e8f0; color: #101b4d; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash svg { width: min(58vw, 16rem); height: auto; overflow: visible; }
      #splash .fc { fill: #141b3b; stroke: currentColor; stroke-width: 4; }
      html[data-theme='light'] #splash .fc { fill: #f5f6fa; }
      #splash .hk { fill: none; stroke: currentColor; stroke-width: 4; }
      #splash .nk, #splash .hb { fill: currentColor; }
      #splash .pn { fill: #141b3b; }
      html[data-theme='light'] #splash .pn { fill: #f5f6fa; }
      #splash .tk { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.5; }
      #splash .tk.m { stroke-opacity: 1; stroke-width: 3; }
      #splash .nf { fill: #ff6155; }
      html[data-theme='light'] #splash .nf { fill: #d6362b; }
      #splash .nd { transform-origin: 160px 178px; animation: splash-sweep 1.15s cubic-bezier(0.34, 1.4, 0.64, 1) 80ms both; }
      @keyframes splash-sweep { from { transform: rotate(-100deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .nd { animation: none; } #splash { transition: none; } }
    </style>
  </head>
